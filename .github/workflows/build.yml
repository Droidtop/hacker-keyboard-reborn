# Builds the app and runs the keyboard's unit tests. Nothing here signs or
# publishes: a release build and its signing are added when the app is
# released (Droidtop/tracker#344). Actions are pinned to the same commits
# droidtop's own workflows pin.
name: Build

on:
  push:
    # main, and lane branches before they land (a workflow on a branch cannot be
    # started by hand until it is on main).
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # The same NDK pin as the keyboard module's ndkVersion.
      NDK_VERSION: 27.0.12077973
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          set -eu
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Build and test
        run: ./gradlew :app:assembleDebug :keyboard:testDebugUnitTest --stacktrace

      - name: Upload the debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hacker-keyboard-reborn-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
